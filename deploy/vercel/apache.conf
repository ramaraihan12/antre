# Apache for the public demo, baked into the image by Dockerfile.vercel.

Listen ${PORT}
ServerName localhost

# One container has 1 vCPU and 2 GiB. A PHP child takes up to about 60 MB.
StartServers 2
MinSpareServers 1
MaxSpareServers 4
MaxRequestWorkers 20

# Vercel terminates TLS and overwrites this header, a value sent by the caller does not survive.
# With it, $request->ip() is the visitor, so the rate limits are per visitor and not per proxy.
RemoteIPHeader x-vercel-forwarded-for
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # File names under /build change with their content. Letting the CDN keep them means a
    # visit does not start the container just for assets.
    <LocationMatch "^/build/">
        Header set Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable"
    </LocationMatch>

    # No CustomLog on purpose. Vercel adds the visitor's location and a live OIDC token to every
    # request, and an access log has no business keeping any of that.
    ErrorLog /proc/self/fd/2
</VirtualHost>
