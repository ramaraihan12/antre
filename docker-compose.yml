# Everything runs from one image: the web app, the Reverb websocket server, the queue
# worker and the scheduler (which expires unpaid bookings every minute).
#
# Ports are published on 127.0.0.1 only, so the demo is not reachable from other machines.
# APP_ENV is "local" so the fake payment driver works without Midtrans keys. Put real keys
# in .env and set APP_ENV=production to switch it off.

x-app: &app
  build:
    context: .
    args:
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-antre-local-key}
  image: antre-app
  env_file:
    - path: .env
      required: false
  environment: &app-env
    APP_KEY: ${APP_KEY:?APP_KEY is empty, see "Run it" in the README}
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: "false"
    APP_URL: http://localhost:8010
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-antre}
    DB_USERNAME: ${DB_USERNAME:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-postgres}
    BROADCAST_CONNECTION: reverb
    QUEUE_CONNECTION: database
    # Inside the compose network the app reaches Reverb by service name.
    REVERB_HOST: reverb
    REVERB_PORT: 8090
    REVERB_SCHEME: http
    REVERB_APP_ID: ${REVERB_APP_ID:-antre-local}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-antre-local-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is empty, see "Run it" in the README}
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:8010:80"
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    # Healthy only after the entrypoint has migrated, so the other services do not start on an empty schema.
    # /login boots the session and needs APP_KEY, so a missing key shows up as unhealthy.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/login') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20

  reverb:
    <<: *app
    depends_on:
      app:
        condition: service_healthy
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php artisan reverb:start --host=0.0.0.0 --port=8090"]
    environment:
      <<: *app-env
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8090
    ports:
      - "127.0.0.1:8090:8090"

  queue:
    <<: *app
    depends_on:
      app:
        condition: service_healthy
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php artisan queue:work --tries=3"]

  scheduler:
    <<: *app
    depends_on:
      app:
        condition: service_healthy
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php artisan schedule:work"]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-antre}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
